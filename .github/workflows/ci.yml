name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache: true
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/memory

  cross-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            output: memory.exe
          - goos: windows
            goarch: arm64
            output: memory.exe
          - goos: darwin
            goarch: amd64
            output: memory
          - goos: darwin
            goarch: arm64
            output: memory
          - goos: linux
            goarch: amd64
            output: memory
          - goos: linux
            goarch: arm64
            output: memory
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache: true
      - run: go build -o "dist/${{ matrix.goos }}-${{ matrix.goarch }}/${{ matrix.output }}" ./cmd/memory
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
